<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO and Meta Tags -->
    <title>Aswani C | AI & Data Science Student | Flutter Developer</title>
    <meta name="description" content="Portfolio of Aswani C, a 3rd Year B.Tech AI & Data Science student, Flutter Developer, and AI Enthusiast showcasing technical projects and skills." />
    <meta name="keywords" content="Aswani C, Portfolio, AI, Data Science, Flutter Developer, React, Student" />
    <meta name="author" content="Aswani C" />
  </head>
  <body>
    <!-- Global Error Overlay to capture and display runtime errors -->
    <script>
      window.addEventListener('error', function(event) {
        var errorOverlay = document.getElementById('error-overlay-container');
        if (!errorOverlay) {
          errorOverlay = document.createElement('div');
          errorOverlay.id = 'error-overlay-container';
          errorOverlay.style.position = 'fixed';
          errorOverlay.style.top = '0';
          errorOverlay.style.left = '0';
          errorOverlay.style.width = '100%';
          errorOverlay.style.height = '100%';
          errorOverlay.style.backgroundColor = '#1a0505';
          errorOverlay.style.color = '#ff6b6b';
          errorOverlay.style.padding = '20px';
          errorOverlay.style.fontFamily = 'monospace';
          errorOverlay.style.zIndex = '999999';
          errorOverlay.style.overflow = 'auto';
          document.body.appendChild(errorOverlay);
        }
        errorOverlay.innerHTML = '<h2>Uncaught Runtime Error:</h2>' +
          '<pre style="white-space: pre-wrap; font-size: 14px;">' +
          event.message + '\n\nFile: ' + event.filename + '\nLine: ' + event.lineno + ':' + event.colno +
          '\n\nStack:\n' + (event.error ? event.error.stack : 'No stack trace available') +
          '</pre>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errorOverlay = document.getElementById('error-overlay-container');
        if (!errorOverlay) {
          errorOverlay = document.createElement('div');
          errorOverlay.id = 'error-overlay-container';
          errorOverlay.style.position = 'fixed';
          errorOverlay.style.top = '0';
          errorOverlay.style.left = '0';
          errorOverlay.style.width = '100%';
          errorOverlay.style.height = '100%';
          errorOverlay.style.backgroundColor = '#1a0505';
          errorOverlay.style.color = '#ff6b6b';
          errorOverlay.style.padding = '20px';
          errorOverlay.style.fontFamily = 'monospace';
          errorOverlay.style.zIndex = '999999';
          errorOverlay.style.overflow = 'auto';
          document.body.appendChild(errorOverlay);
        }
        errorOverlay.innerHTML = '<h2>Unhandled Promise Rejection:</h2>' +
          '<pre style="white-space: pre-wrap; font-size: 14px;">' +
          event.reason + '\n\nStack:\n' + (event.reason && event.reason.stack ? event.reason.stack : 'No stack trace available') +
          '</pre>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
